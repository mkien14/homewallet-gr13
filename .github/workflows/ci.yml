name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: backend

    env:
      AWS_EC2_METADATA_DISABLED: "true"
      AWS_DEFAULT_REGION: ap-southeast-1

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -ra

      - name: Verify Redis TLS, cache and atomic admission on an isolated local server
        run: python ../scripts/run-redis-acceptance.py

      - name: Test production release safety gates
        run: python -m pytest ../scripts/tests -ra

  ocr-pilot-guards:
    name: OCR pilot offline checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: ocr-lab

    env:
      AWS_EC2_METADATA_DISABLED: "true"

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ocr-lab/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest test_bedrock_access.py test_d3_pilot_v2.py -q

  community-mysql:
    name: Community authorization and MySQL acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: d2-local-test-only
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pd2-local-test-only"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

    defaults:
      run:
        working-directory: backend

    env:
      AWS_EC2_METADATA_DISABLED: "true"
      AWS_DEFAULT_REGION: ap-southeast-1
      HOMEWALLET_COMMUNITY_MYSQL: "1"
      HOMEWALLET_HISTORY_MYSQL: "1"
      HOMEWALLET_TEST_DB_HOST: 127.0.0.1
      HOMEWALLET_TEST_DB_PORT: "3307"
      HOMEWALLET_TEST_DB_PASSWORD: d2-local-test-only

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest tests/test_auth.py tests/test_community.py tests/test_community_mysql.py tests/test_household_history_mysql.py -ra

  docker:
    name: Build backend image
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Build image
        run: >
          docker build
          --file backend/Dockerfile
          --tag homewallet-backend:ci
          backend

  terraform:
    name: Terraform format and validate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"

      - name: Check formatting
        run: terraform fmt -check -recursive infra

      - name: Initialize without remote backend
        run: terraform -chdir=infra/envs/dev init -backend=false -input=false

      - name: Validate dev configuration
        run: terraform -chdir=infra/envs/dev validate -no-color

      - name: Initialize and validate production without AWS access
        run: |
          terraform -chdir=infra/envs/prod init -backend=false -input=false
          terraform -chdir=infra/envs/prod validate -no-color
          terraform -chdir=infra/envs/dev test -no-color
          terraform -chdir=infra/envs/prod test -no-color
